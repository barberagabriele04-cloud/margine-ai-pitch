<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1f5a45" />
  <title>Margine.ai — Demo gestionale</title>
  <meta name="description" content="Demo navigabile dell'interfaccia di Margine.ai. Panoramica margini, personale, prenotazioni e fatture in un unico posto." />
  <meta name="robots" content="noindex" />

  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%230F4D3A'/><path d='M8 22 L13 14 L17 18 L24 8' stroke='%23F5F1EA' stroke-width='2.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/><path d='M19 8 L24 8 L24 13' stroke='%23F5F1EA' stroke-width='2.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap">

  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="icons.jsx"></script>
  <script type="text/babel" src="shell.jsx"></script>
  <script type="text/babel" src="screen-panoramica.jsx"></script>
  <script type="text/babel" src="screen-personale.jsx"></script>
  <script type="text/babel" src="screen-prenotazioni.jsx"></script>
  <script type="text/babel" src="screen-fatture.jsx"></script>
  <script type="text/babel" src="tweaks-panel.jsx"></script>

  <script type="text/babel" data-presets="react">
    const { useState, useEffect } = React;

    const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
      "theme": "dark",
      "density": "cozy",
      "brand": "vivid",
      "screen": "panoramica"
    }/*EDITMODE-END*/;

    const BRAND_PRESETS = {
      moss:   { h: 158, c: 0.06 },   /* verde Margine — bottiglia profondo */
      forest: { h: 165, c: 0.07 },   /* pino, leggermente più freddo */
      slate:  { h: 230, c: 0.04 },   /* blu-grigio bank-grade */
      ink:    { h: 250, c: 0.05 },   /* indaco scuro */
      vivid:  { h: 158, c: 0.10 },   /* verde più saturo */
    };

    function applyBrand(name) {
      const p = BRAND_PRESETS[name] || BRAND_PRESETS.moss;
      const r = document.documentElement.style;
      r.setProperty("--brand-h", p.h);
      r.setProperty("--brand-c", p.c);
    }

    function App() {
      const [t, setT] = useTweaks(TWEAK_DEFAULTS);
      const [active, setActive] = useState(t.screen || "panoramica");

      useEffect(() => { document.documentElement.dataset.theme = t.theme; }, [t.theme]);
      useEffect(() => { document.documentElement.dataset.density = t.density; }, [t.density]);
      useEffect(() => { applyBrand(t.brand); }, [t.brand]);
      useEffect(() => { setT({ screen: active }); }, [active]);

      const titles = {
        panoramica:  ["Panoramica", "Martedì 5 maggio 2026 · settimana 19"],
        personale:   ["Personale", "5 → 11 maggio 2026 · 6 collaboratori attivi"],
        prenotazioni:["Prenotazioni", "14 oggi · bot WhatsApp attivo"],
        fatture:     ["Fatture", "2 urgenze · 14 in arrivo · €8.430 da pagare"],
      };
      const [title, sub] = titles[active] || titles.panoramica;

      return (
        <div className="app">
          <Sidebar active={active} onChange={setActive} />
          <div className="app__main">
            <Topbar active={active} title={title} sub={sub} />
            <main className="content" key={active}>
              {active === "panoramica" && <Panoramica />}
              {active === "personale" && <Personale />}
              {active === "prenotazioni" && <Prenotazioni />}
              {active === "fatture" && <Fatture />}
            </main>
          </div>
          <MobileNav active={active} onChange={setActive} />

          <TweaksPanel title="Tweaks">
            <TweakSection label="Tema">
              <TweakRadio
                label="Modalità"
                value={t.theme}
                onChange={v => setT("theme", v)}
                options={[{value:"light", label:"Chiaro"},{value:"dark", label:"Scuro"}]}
              />
            </TweakSection>

            <TweakSection label="Densità">
              <TweakRadio
                label="Spaziatura"
                value={t.density}
                onChange={v => setT("density", v)}
                options={[
                  {value:"compact", label:"Compatta"},
                  {value:"cozy",    label:"Comoda"},
                  {value:"comfy",   label:"Ariosa"},
                ]}
              />
            </TweakSection>

            <TweakSection label="Colore brand">
              <TweakColor
                label="Verde Margine"
                value={t.brand}
                onChange={v => setT("brand", v)}
                options={["moss","forest","slate","ink","vivid"]}
              />
            </TweakSection>

            <TweakSection label="Schermata">
              <TweakSelect
                label="Vai a"
                value={active}
                onChange={v => setActive(v)}
                options={NAV.map(n => ({value:n.id, label:n.label}))}
              />
            </TweakSection>
          </TweaksPanel>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>

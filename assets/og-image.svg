<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" font-family="Inter, -apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#085041"/>
      <stop offset="100%" stop-color="#1D9E75"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Soft texture: grid of faint dots -->
  <g fill="#ffffff" opacity="0.06">
    <circle cx="120" cy="120" r="3"/>
    <circle cx="220" cy="120" r="3"/>
    <circle cx="320" cy="120" r="3"/>
    <circle cx="1080" cy="510" r="3"/>
    <circle cx="980" cy="510" r="3"/>
    <circle cx="880" cy="510" r="3"/>
  </g>

  <!-- Logo mark — cloche/restaurant icon -->
  <g transform="translate(110 200)">
    <rect width="96" height="96" rx="22" fill="#ffffff"/>
    <g transform="translate(20 20) scale(2.8)" stroke="#1D9E75" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <line x1="3" y1="15" x2="17" y2="15"/>
      <path d="M4.5 15 Q4.5 8 10 8 Q15.5 8 15.5 15"/>
      <circle cx="10" cy="5.5" r="1.3" fill="#1D9E75"/>
      <line x1="10" y1="6.8" x2="10" y2="8"/>
    </g>
  </g>

  <!-- Wordmark -->
  <text x="230" y="265" fill="#ffffff" font-size="68" font-weight="500" letter-spacing="-2">
    Peak<tspan fill="#A8E5CE">rest</tspan>
  </text>

  <!-- Headline -->
  <text x="110" y="400" fill="#ffffff" font-size="56" font-weight="500" letter-spacing="-1.5">Il tuo analista personale,</text>
  <text x="110" y="470" fill="#ffffff" font-size="56" font-weight="500" letter-spacing="-1.5">su WhatsApp.</text>

  <!-- Subline -->
  <text x="110" y="540" fill="#ffffff" opacity="0.85" font-size="26" font-weight="400">Ogni lunedì mattina, 3 cose da fare per guadagnare di più.</text>
</svg>
